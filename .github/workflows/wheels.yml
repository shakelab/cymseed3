# Build the wheels (cibuildwheel) and the source distribution, and test
# them. The release workflow will publish the artifacts of a tag.
name: Wheels

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # Linux x86_64 (manylinux, musllinux)
          - ubuntu-24.04-arm   # Linux aarch64 (manylinux, musllinux)
          - windows-latest     # Windows AMD64
          - macos-15-intel     # macOS x86_64
          - macos-latest       # macOS arm64

    steps:
      - uses: actions/checkout@v5

      - name: Build and test the wheels
        uses: pypa/cibuildwheel@v3.2.1

      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build the source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist/*.tar.gz
